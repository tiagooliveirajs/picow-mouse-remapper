name: Pico 2 W firmware build

on:
  push:
    branches:
      - feat/pico-03-waveshare-lcd-baseline
      - feat/pico-04-canonical-hid-usb-composite
      - feat/pico-05-device-identity-profiles
      - feat/pico-06-default-custom-remapper
  pull_request:
    paths:
      - 'src_fw/**'
      - '.github/workflows/pico-build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4

      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Fetch Pico SDK 2.2.0
        run: |
          git clone --branch 2.2.0 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/raspberrypi/pico-sdk.git "$GITHUB_WORKSPACE/pico-sdk"

      - name: Configure
        run: |
          cmake \
            -S src_fw/picow_ble_usb_hid_bridge \
            -B build/picow_ble_usb_hid_bridge \
            -G Ninja \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DPICO_BOARD=pico2_w

      - name: Build
        run: cmake --build build/picow_ble_usb_hid_bridge

      - name: Publish UF2
        uses: actions/upload-artifact@v4
        with:
          name: pico2w-pico06-uf2
          path: build/picow_ble_usb_hid_bridge/picow_ble_usb_hid_bridge.uf2
          if-no-files-found: error
